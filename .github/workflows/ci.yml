name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run tests
        run: npm test
        env:
          # Stub values for env() — tests that call env() must mock it;
          # these are here so module imports don't crash on missing env.
          TOKEN_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          OAUTH_STATE_SECRET: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          APP_BASE_URL: "https://test.example.com"
          LINE_CHANNEL_SECRET: "test"
          LINE_CHANNEL_ACCESS_TOKEN: "test"
